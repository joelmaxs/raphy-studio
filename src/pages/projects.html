<!DOCTYPE html>
<html lang="pt-br">

<head>
{{head}}
</head>

<body class="projects-page">
    <div id="loader-container"></div>
    <div id="header-container"></div>

    <main>
        <section class="projects-container">
            <div class="projects-container-texts pf" role="group" aria-label="Filter projects">
                <button type="button" class="pf-i is-on" data-filter="all" aria-pressed="true">All<span class="pf-n">{{projectCount}}</span></button>
                <button type="button" class="pf-i" data-filter="originals" aria-pressed="false">Originals<span class="pf-n">{{originalsCount}}</span></button>
                <button type="button" class="pf-i" data-filter="commercial" aria-pressed="false">Commercial<span class="pf-n">{{commercialCount}}</span></button>
            </div>
        </section>

        <section class="projects">
{{gridProjects}}
        </section>

        <section class="clients">
            <div class="clients-container reveal02">
                <span class="section-header" id="clients-header">/ Clients & partners</span>

                <span id="clients-name">
                    Riot Games&nbsp;/ Blizzard Entertainment&nbsp;/ Shell&nbsp;/ Goodboy Creative&nbsp;/ Senna Brasil&nbsp;/ Pubg&nbsp;/
                    Team Falcons
                </span>
            </div>
        </section>

        <section class="contact reveal03">
            <a href="/contact" id="contact-text">
                <span>Let's</span><br>
                <span>Talk</span>
            </a>

            <span class="section-header" id="contact-header">/ GET IN TOUCH</span>
        </section>
    </main>

    <div id="footer-container"></div>
{{scripts}}
</body>

</html>
