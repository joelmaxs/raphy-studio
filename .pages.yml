# Painel de edição — Pages CMS (https://app.pagescms.org)
# Cada projeto é um arquivo em content/projects/. Ao salvar, a Cloudflare reconstrói o site sozinha.

media:
  input: public/assets
  output: /assets
  extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm]

content:
  - name: projects-page
    label: Página Projects (grade)
    type: file
    path: content/projects-page.json
    format: json
    fields:
      - name: rows
        label: Linhas da grade
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "Linha {index} — {layout} projeto(s)"
        description: "Monte a grade linha por linha: escolha quantos projetos lado a lado (1, 2 ou 3) e quais. Arraste para reordenar. Projetos publicados que não estiverem em nenhuma linha entram no final, pela ordem."
        fields:
          - name: layout
            label: Projetos nesta linha
            type: select
            required: true
            options:
              values:
                - { value: "1", label: 1 projeto (largura total) }
                - { value: "2", label: 2 projetos }
                - { value: "3", label: 3 projetos }
          - name: projects
            label: Projetos
            type: reference
            required: true
            options:
              collection: projects
              multiple: true
              min: 1
              max: 3
              search: "slug,title"
              value: "{slug}"
              label: "{title}"

  - name: projects
    label: Projetos
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: slug
      fields: [title, category, published]
      sort: order
      order: asc
    fields:
      - name: slug
        label: Endereço da página
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Só letras minúsculas, números e hífen (ex.: meu-projeto)"
        description: "Vira o link raphystudio.com/projects/ENDEREÇO. Não mude depois de publicado."
      - name: title
        label: Nome do projeto
        type: string
        required: true
        description: "Como aparece no card (ex.: RUSH - Valorant Cinematic)."
      - name: published
        label: Publicado
        type: boolean
        default: true
      - name: category
        label: Categoria (filtro da página Projects)
        type: select
        required: true
        options:
          values:
            - { value: originals, label: Originals }
            - { value: commercial, label: Commercial }
      - name: order
        label: Ordem (reserva)
        type: number
        description: "Só vale para projetos que não estão em nenhuma linha da grade (Página Projects)."

      - name: grid
        label: Card na página Projects
        type: object
        fields:
          - { name: cover, label: Capa (imagem), type: image, required: true }
          - { name: video, label: Vídeo do card (mp4 curto, sem áudio), type: file, options: { categories: [video] } }
          - { name: coverPosition, label: Enquadramento da capa, type: string, description: "center, left, right ou porcentagem (ex.: 43%)" }

      - name: destination
        label: Ao clicar no projeto
        type: block
        blockKey: type
        required: true
        list:
          min: 1
          max: 1
        description: "Escolha UM: página própria (monta a página com blocos) ou link externo (só o link)."
        blocks:
          - name: external
            label: Abrir link externo (Behance, YouTube…)
            fields:
              - { name: url, label: Link, type: string, required: true, pattern: { regex: "^https?://", message: "Comece com https://" } }
          - name: page
            label: Abrir página do projeto
            fields:
              - { name: seoDescription, label: Descrição para Google / WhatsApp, type: text, description: "1 ou 2 frases." }
              - name: theme
                label: Fundo da página
                type: select
                options: { values: [{ value: white, label: Branco }, { value: black, label: Preto }] }
              - name: logo
                label: Cor da logo no topo
                type: select
                options: { values: [{ value: black, label: Preta }, { value: white, label: Branca }] }
              - name: menuIcon
                label: Ícone do menu
                type: select
                options:
                  values:
                    - { value: dark, label: Escuro (para fundo claro) }
                    - { value: light, label: Claro (para fundo escuro) }
              - { name: overflowVisible, type: boolean, hidden: true }
              - name: sections
                label: Seções da página
                type: block
                blockKey: type
                list:
                  collapsible:
                    collapsed: true
                description: "Adicione, remova, edite e arraste para mudar a ordem. Cada bloco vira uma seção da página, nesta ordem."
                blocks:
                  - name: hero
                    label: Capa com logo (estilo Tears of Blood)
                    fields:
                      - { name: text, label: Texto, type: string }
                      - { name: logo, label: Logo, type: image }
                      - { name: button1Text, label: Botão 1 — texto, type: string }
                      - { name: button1Link, label: Botão 1 — link, type: string }
                      - { name: button2Text, label: Botão 2 — texto, type: string }
                      - { name: button2Link, label: Botão 2 — link, type: string }
                      - { name: button2Icon, label: Botão 2 — ícone, type: image }
                  - name: title
                    label: Título grande + número
                    fields:
                      - { name: title, label: Título, type: text }
                      - { name: number, label: Número, type: string }
                  - name: video
                    label: Vídeo do YouTube
                    fields:
                      - { name: youtubeId, label: ID do vídeo, type: string, required: true, description: "O código depois de v= no link (ex.: 3q9ztkkuHYc)" }
                      - { name: youtubeShortsId, label: ID da versão vertical (celular), type: string }
                  - name: description
                    label: Descrição + colunas
                    fields:
                      - { name: header, label: Rótulo (ex. / DESCRIPTION), type: string }
                      - { name: text, label: Texto principal, type: text }
                      - { name: column1, label: Coluna 1, type: text }
                      - { name: column2Title, label: Coluna 2 — título, type: text }
                      - { name: column2Text, label: Coluna 2 — texto, type: text }
                      - { name: column3, label: Coluna 3, type: text }
                      - { name: column4, label: Coluna 4, type: text }
                  - name: gallery
                    label: Galeria de imagens
                    fields:
                      - { name: images, label: Imagens, type: image, options: { multiple: { max: 24 } } }
                  - name: slider
                    label: Carrossel
                    fields:
                      - { name: title, label: Rótulo, type: string }
                      - { name: text, label: Texto, type: text }
                      - { name: images, label: Imagens, type: image, options: { multiple: { max: 20 } } }
                  - name: concept
                    label: Concept (texto + 2 imagens)
                    fields:
                      - { name: header, label: Rótulo, type: string }
                      - { name: text1, label: Texto 1, type: text }
                      - { name: text2, label: Texto 2, type: text }
                      - { name: image1, label: Imagem 1, type: image }
                      - { name: image1Label, label: Imagem 1 — legenda, type: string }
                      - { name: image1Credit, label: Imagem 1 — crédito, type: string }
                      - { name: image2, label: Imagem 2, type: image }
                      - { name: image2Label, label: Imagem 2 — legenda, type: string }
                      - { name: image2Credit, label: Imagem 2 — crédito, type: string }
                  - name: fullImage
                    label: Imagem de tela cheia
                    fields:
                      - { name: image, label: Imagem, type: image, required: true }
                  - name: process
                    label: Processo (imagens que trocam ao rolar)
                    fields:
                      - name: steps
                        label: Etapas
                        type: object
                        list: true
                        fields:
                          - { name: title, label: Título, type: string }
                          - { name: text, label: Texto, type: text }
                          - { name: image, label: Imagem, type: image }
                  - name: twoImages
                    label: Texto + duas imagens (estilo Animação 2D)
                    fields:
                      - { name: header, label: Rótulo, type: string }
                      - { name: text, label: Texto, type: text }
                      - { name: image1, label: Imagem 1, type: image }
                      - { name: image2, label: Imagem 2, type: image }
                  - name: credits
                    label: Créditos
                    fields:
                      - { name: header, label: Rótulo, type: string }
                      - name: people
                        label: Pessoas
                        type: object
                        list: true
                        fields:
                          - { name: name, label: Nome, type: string }
                          - { name: role, label: Função, type: string }
                  - name: contact
                    label: Bloco "Let's Talk"
                    fields:
                      - { name: header, label: Rótulo, type: string }
                  - name: trailerBanner
                    label: Banner de trailer + texto final (estilo Tears of Blood)
                    fields:
                      - { name: title, label: Título, type: text }
                      - { name: link, label: Link do trailer, type: string }
                      - { name: text1, label: Texto 1, type: text }
                      - { name: text2, label: Texto 2, type: text }
                      - { name: text3, label: Texto 3 (negrito), type: text }

      - name: homeHighlight
        label: Destaque na Home
        type: block
        blockKey: type
        list:
          max: 1
        description: "Adicione o bloco para o projeto aparecer na Home. Sem bloco, não aparece."
        blocks:
          - name: home
            label: Mostrar na Home
            fields:
              - { name: order, label: Ordem na Home, type: number }
              - { name: title, label: Título (uma linha por linha), type: text, required: true }
              - { name: lead, label: Frase em negrito, type: text }
              - { name: paragraphs, label: Parágrafos, type: text, list: true }
              - { name: cover, label: Imagem, type: image, required: true }
              - { name: coverPosition, label: Enquadramento da imagem, type: string }

      - { name: legacyId, type: string, hidden: true }
